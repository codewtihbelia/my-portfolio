# ==============================================================================
# Render Infrastructure Blueprint (render.yaml)
# Multi-service separation: Static Site (Frontend) + Web Service (Backend API)
# ==============================================================================

services:
  # ----------------------------------------------------------------------------
  # 1. FRONTEND: High-Performance Global Static Site (CDN)
  # ----------------------------------------------------------------------------
  - type: web
    name: portfolio-frontend
    runtime: static
    buildCommand: npm run build:client
    staticPublishPath: ./dist
    routes:
      # React SPA catch-all rewrite rule for client-side routing
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # Automatically wires the backend Web Service URL to the frontend
      - key: VITE_API_URL
        fromService:
          type: web
          name: portfolio-backend
          property: host

  # ----------------------------------------------------------------------------
  # 2. BACKEND: Persistent Node.js Express Web Service
  # ----------------------------------------------------------------------------
  - type: web
    name: portfolio-backend
    runtime: node
    plan: free
    buildCommand: npm run build:server
    startCommand: npm run start:server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
